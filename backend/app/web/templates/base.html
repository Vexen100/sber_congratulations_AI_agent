<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{title or "Агент поздравлений"}}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
      :root {
        --bg: #f3f7f4;
        --surface: #ffffff;
        --surface-2: #f8fbf9;
        --border: #d9e6de;
        --text: #173228;
        --muted: #6d7f76;
        --primary: #12a150;
        --primary-dark: #0b7d3d;
        --primary-soft: #e8f6ee;
        --warning-soft: #fff4d9;
        --danger-soft: #fde8e8;
        --shadow: 0 16px 40px rgba(17, 52, 37, 0.08);
      }

      body {
        background:
          radial-gradient(circle at top right, rgba(18, 161, 80, 0.10), transparent 28%),
          linear-gradient(180deg, #f7fbf8 0%, var(--bg) 100%);
        color: var(--text);
        font-family: Inter, "Segoe UI", system-ui, sans-serif;
      }

      a { text-decoration: none; }
      code.small { font-size: .85em; }

      .layout-shell {
        min-height: 100vh;
      }

      .sidebar-shell {
        background: rgba(255, 255, 255, 0.92);
        backdrop-filter: blur(10px);
        border-right: 1px solid rgba(217, 230, 222, 0.9);
        overflow-x: hidden;
      }

      .brand-card {
        background: linear-gradient(135deg, #0d7d3c 0%, #12a150 55%, #41c77b 100%);
        color: #fff;
        border-radius: 22px;
        padding: 1.1rem 1.1rem 1rem;
        box-shadow: var(--shadow);
      }

      .brand-title {
        font-weight: 800;
        letter-spacing: .2px;
        margin-bottom: .2rem;
      }

      .brand-subtitle {
        color: rgba(255, 255, 255, 0.82);
        font-size: .9rem;
      }

      .quick-action {
        border-radius: 14px;
        font-weight: 600;
        box-shadow: 0 8px 20px rgba(18, 161, 80, 0.12);
      }

      .btn-outline-primary {
        background: none;
        
      }
      .quick-action.btn-success {
        background: linear-gradient(135deg, var(--primary) 0%, #26b060 100%);
        border-color: transparent;
      }

      .quick-action.btn-outline-secondary,
      .quick-action.btn-outline-danger {
        background: #fff;
        border-color: var(--border);
        color: var(--text);
      }

      .nav-stack {
        display: grid;
        gap: .5rem;
      }

      .nav-chip {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: .75rem;
        padding: .85rem 1rem;
        border-radius: 16px;
        color: var(--text);
        background: transparent;
        border: 1px solid transparent;
        transition: all .18s ease;
        font-weight: 600;
      }

      .nav-chip:hover {
        background: rgba(18, 161, 80, 0.06);
        border-color: rgba(18, 161, 80, 0.12);
        color: var(--primary-dark);
      }

      .nav-chip.active {
        background: linear-gradient(135deg, rgba(18, 161, 80, 0.14), rgba(18, 161, 80, 0.06));
        border-color: rgba(18, 161, 80, 0.18);
        color: var(--primary-dark);
        box-shadow: none;
      }

      .nav-chip small {
        color: var(--muted);
        font-weight: 500;
      }

      .nav-chip.active small {
        color: rgba(11, 125, 61, 0.78);
      }

      .delivery-pill {
        display: inline-flex;
        align-items: center;
        gap: .35rem;
        padding: .45rem 16px;
        border-radius: 16px;
        background: var(--primary-soft);
        color: var(--primary-dark);
        font-weight: 700;
        font-size: .85rem;
      }

      .content-shell {
        padding: 1.75rem 1.75rem 2rem;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        margin-bottom: 1.25rem;
      }

      .topbar-meta {
        color: var(--muted);
        font-size: .92rem;
      }

      .surface-card,
      .surface-panel {
        background: rgba(255, 255, 255, 0.94);
        border: 1px solid rgba(217, 230, 222, 0.9);
        border-radius: 22px;
        box-shadow: var(--shadow);
      }

      .surface-panel {
        padding: 1.25rem;
      }

      .hero-card {
        background:
          radial-gradient(circle at top right, rgba(255, 255, 255, 0.22), transparent 28%),
          linear-gradient(135deg, #0f7d3d 0%, #12a150 55%, #2db766 100%);
        color: #fff;
        border-radius: 28px;
        padding: 1.5rem;
        box-shadow: 0 24px 50px rgba(18, 161, 80, 0.20);
      }

      .hero-card p,
      .hero-card .text-soft {
        color: rgba(255, 255, 255, 0.85);
      }

      .hero-badge {
        display: inline-flex;
        align-items: center;
        gap: .4rem;
        padding: .35rem .7rem;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.16);
        color: #fff;
        font-size: .82rem;
        font-weight: 700;
        letter-spacing: .2px;
      }

      .metric-card {
        height: 100%;
        padding: 1.15rem 1.2rem;
      }

      .metric-label {
        color: var(--muted);
        font-size: .88rem;
        font-weight: 600;
      }

      .metric-value {
        font-size: 2rem;
        font-weight: 800;
        line-height: 1;
        margin: .45rem 0;

      }

      .metric-hint {
        color: var(--muted);
        font-size: .82rem;
      }

      .section-title {
        font-size: 1.05rem;
        font-weight: 800;
        margin-bottom: .25rem;
      }

      .section-subtitle {
        color: var(--muted);
        font-size: .92rem;
      }

      .workflow-step {
        display: flex;
        gap: .9rem;
        align-items: flex-start;
      }

      .workflow-index {
        width: 2rem;
        height: 2rem;
        min-width: 2rem;
        border-radius: 50%;
        background: var(--primary-soft);
        color: var(--primary-dark);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-weight: 800;
      }

      .table-card .card-header,
      .surface-card .card-header {
        background: transparent;
        border-bottom: 1px solid rgba(217, 230, 222, 0.9);
        padding: 1rem 1.2rem .95rem;
        font-weight: 800;
      }

      .surface-card .card-body {
        box-sizing: border-box;
        height: 100%;
        padding: 1rem 1.2rem 1.2rem;
      }

      .table-clean {
        --bs-table-bg: transparent;
        --bs-table-border-color: rgba(217, 230, 222, 0.8);
      }

      .table-clean thead th {
        color: var(--muted);
        font-size: .78rem;
        text-transform: uppercase;
        letter-spacing: .04em;
        font-weight: 800;
        border-top: 0;
      }

      .table-clean tbody tr:hover {
        background: rgba(18, 161, 80, 0.04);
      }

      .soft-note {
        background: var(--surface-2);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 1rem 1.1rem;
      }

      .status-dot {
        width: .55rem;
        height: .55rem;
        border-radius: 50%;
        display: inline-block;
        background: var(--primary);
      }

      .card-preview {
        max-width: 220px;
        border-radius: 16px;
        border: 1px solid rgba(217, 230, 222, 0.85);
        box-shadow: 0 10px 24px rgba(17, 52, 37, 0.12);
      }

      .kpi-strip {
        display: flex;
        /* flex-wrap: wrap; */
        gap: .75rem;
      }

      .kpi-strip-container {
        display: flex;
        flex-wrap: wrap;
        gap: .75rem;
        margin-bottom: 2rem;
      }
      .kpi-pill {
        padding: .65rem .85rem;
        border-radius: 16px;
        background: #fff;
        border: 1px solid var(--border);
        color: var(--text);
        min-width: 140px;
      }

      .kpi-pill b {
        display: block;
        font-size: 1.05rem;
        flex-wrap: wrap;
      }

      .form-panel {
        background: linear-gradient(180deg, rgba(255,255,255,0.98), rgba(248,251,249,0.96));
      }

      .page-intro {
        max-width: 72ch;
      }

      .empty-state {
        padding: 2rem;
        text-align: center;
        color: var(--muted);
      }

      .actions-col {
        min-width: 124px;
        white-space: nowrap;
        padding-right: 1rem !important;
      }

      .action-btn {
        min-width: 104px;
      }
      /* === Donut Pie Chart (Pure CSS) === */
      .css-pie-wrapper {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1rem;
        width: 100%;
      }

      .css-pie {
        --val-birthday: 0;
        --val-holiday: 0;
        --val-manual: 0;
        --total: 1;

        width: 200px;
        height: 200px;
        border-radius: 50%;
        position: relative;
        box-shadow: 0 4px 12px rgba(18, 161, 80, 0.12);
        transition: transform 0.2s ease;

        /* Сегменты диаграммы */
        background: conic-gradient(
          var(--primary) 0% calc(var(--val-birthday) / var(--total) * 100%),
          var(--primary-dark) calc(var(--val-birthday) / var(--total) * 100%) calc((var(--val-birthday) + var(--val-holiday)) / var(--total) * 100%),
          #41c77b calc((var(--val-birthday) + var(--val-holiday)) / var(--total) * 100%) 100%
        );
      }

      .css-pie:hover {
        transform: scale(1.02);
      }

      /* Пустой набор данных */
      .css-pie[data-empty="true"] {
        background: var(--border);
        box-shadow: none;
      }

      /* Центральная часть (donut hole) */
      .css-pie-center {
        position: absolute;
        inset: 20px;
        border-radius: 50%;
        background: var(--surface);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 2;
        box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.04);
      }

      .css-pie-center .pie-total {
        font-size: 1.75rem;
        font-weight: 800;
        color: var(--text);
        line-height: 1;
      }

      .css-pie-center .pie-label {
        font-size: 0.75rem;
        color: var(--muted);
        font-weight: 500;
        margin-top: 0.25rem;
      }

      /* Адаптив */
      @media (max-width: 576px) {
        .css-pie {
          width: 130px;
          height: 130px;
        }
        .css-pie-center {
          inset: 16px;
        }
        .css-pie-center .pie-total {
          font-size: 1.4rem;
        }
      }


      @media (min-width: 1200px) {
        .col-xl-7 {
          width: 100%;
        }
      }

      @media (min-width: 768px) {
        .col-md-2 {
          flex: 0 0 auto;
          width: 16%;
        }
      }
      .contact-pill {
        color: var(--text);
        border: 1px solid var(--border);
        font-weight: 500;
        text-align: left;
        width: fit-content;
        max-width: 100%;
      }

      @media (max-width: 991px) {
        .content-shell {
          padding: 1rem;
        }
        .sidebar-shell {
          min-height: auto !important;
        }
      }
    </style>
  </head>
  <body>
    {% set current_path = request.url.path if request is defined else "/" %}
    <div class="container-fluid layout-shell">
      <div class="row g-0">
        <aside class="col-12 col-lg-3 col-xl-2 p-3 p-lg-4 min-vh-100 sidebar-shell">
          <div class="d-grid gap-2 mb-4">
            <form action="/actions/run-agent" method="post">
              <button class="btn btn-success quick-action w-100">Запустить агента</button>
            </form>
            <form action="/actions/seed-demo" method="post">
              <button class="btn btn-outline-secondary quick-action w-100">Загрузить данные</button>
            </form>
            <form action="/actions/reset-runtime" method="post">
              <button class="btn btn-outline-danger quick-action w-100">Очистить среду</button>
            </form>
          </div>
          <div class="section-title">Placeholder</div>
          <!-- <div class="section-subtitle mb-3">Навигация по конвейеру и контролю качества.</div> -->
          <div class="nav-stack">
            <a class="nav-chip {% if current_path == '/' %}active{% endif %}" href="/">
              <span>Дашборд</span>
            </a>
            <a class="nav-chip {% if current_path.startswith('/clients') %}active{% endif %}" href="/clients">
              <span>Клиенты</span>
            </a>
            <a class="nav-chip {% if current_path.startswith('/events') %}active{% endif %}" href="/events">
              <span>События</span>
            </a>
            <a class="nav-chip {% if current_path.startswith('/greetings') %}active{% endif %}" href="/greetings">
              <span>Поздравления</span>
            </a>
            <a class="nav-chip {% if current_path.startswith('/deliveries') %}active{% endif %}" href="/deliveries">
              <span>Доставки</span>
            </a>
            <!-- под вопросом? -->
            <a class="nav-chip {% if current_path.startswith('/runs') %}active{% endif %}" href="/runs">
              <span>Запуски агента</span>
            </a>
            <!-- <a class="nav-chip" href="/docs">
              <span>Документация API</span>
            </a> -->
          </div>
          <div class="mt-4">
            <div class="delivery-pill">Режим доставки: файловый outbox</div>
          </div>
        </aside>
        <main class="col-12 col-lg-9 col-xl-10 content-shell">
          <div class="topbar">
            <div>
            </div>
          </div>
          {% block content %}{% endblock %}
        </main>
      </div>
    </div>
  </body>
</html>
