<!doctype html>
<html lang="ru">
  <head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{title or "Агент поздравлений"}}</title>
    <link rel="stylesheet" href="{{ url_for('data', path='css/main.css') }}">
  </head>
  <body>
    {% set current_path = request.url.path if request is defined else "/" %}
    <div class="container-fluid layout-shell">
      <div class="row g-0">
        <aside class="col-12 col-lg-3 col-xl-2 p-3 p-lg-4 min-vh-100 sidebar-shell">
          <div class="d-grid gap-2 mb-4">
            <form action="/actions/run-agent" method="post">
              <button class="btn btn-success quick-action w-100">Запустить агента</button>
            </form>
            <form action="/actions/seed-demo" method="post">
              <button class="btn btn-outline-secondary quick-action w-100">Загрузить данные</button>
            </form>
            <form action="/actions/reset-runtime" method="post">
              <button class="btn btn-outline-danger quick-action w-100">Очистить среду</button>
            </form>
          </div>
          <div class="section-title">Placeholder</div>
          <!-- <div class="section-subtitle mb-3">Навигация по конвейеру и контролю качества.</div> -->
          <div class="nav-stack">
            <a class="nav-chip {% if current_path == '/' %}active{% endif %}" href="/">
              <span>Дашборд</span>
            </a>
            <a class="nav-chip {% if current_path.startswith('/clients') %}active{% endif %}" href="/clients">
              <span>Клиенты</span>
            </a>
            <a class="nav-chip {% if current_path.startswith('/events') %}active{% endif %}" href="/events">
              <span>События</span>
            </a>
            <a class="nav-chip {% if current_path.startswith('/greetings') %}active{% endif %}" href="/greetings">
              <span>Поздравления</span>
            </a>
            <a class="nav-chip {% if current_path.startswith('/deliveries') %}active{% endif %}" href="/deliveries">
              <span>Доставки</span>
            </a>
            <!-- под вопросом? -->
            <a class="nav-chip {% if current_path.startswith('/runs') %}active{% endif %}" href="/runs">
              <span>Запуски агента</span>
            </a>
            <!-- <a class="nav-chip" href="/docs">
              <span>Документация API</span>
            </a> -->
          </div>
          <div class="mt-4">
            <div class="delivery-pill">Режим доставки: файловый outbox</div>
          </div>
        </aside>
        <main class="col-12 col-lg-9 col-xl-10 content-shell">
          <div class="topbar">
            <div>
            </div>
          </div>
          {% block content %}{% endblock %}
        </main>
      </div>
    </div>
  </body>
</html>
